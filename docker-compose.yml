services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: events-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: events-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
